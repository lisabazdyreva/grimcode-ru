# Production topology — the deployed system, and the reason this file has the plain name.
#
# Local development runs `docker/compose.local.yaml` instead, through `pnpm start`.
#
# Two containers of ours and two jobs that run to completion. `server` is the whole application —
# every module in one process — and `adminer` is a third-party console the panel embeds. Nothing is
# reachable from outside except through `server`. PostgreSQL is not here: in production the database
# is a managed resource of the deployment platform, reached through DATABASE_URL, so the application
# never runs its own.
#
# There is no host port for `server` either. The platform routes the domain to the container's
# fixed internal port, which is why nobody has to choose a number.
#
# Two names sit close together here and mean different things: the Compose service `server` is the
# whole process, and `gateway` inside it is the module that traffic enters through.
#
# Everything a deployment must supply is listed in `docs/deployment.md`; the `:?` markers below
# are what enforces it.

name: ${PROJECT_SLUG:?PROJECT_SLUG is required}

# Kept apart from `x-app` because Adminer has a build of its own and still wants the same limits.
x-logging: &logging
  driver: json-file
  options: { max-size: '10m', max-file: '3' }

# One image, three uses: the application, and two jobs that run to completion before it starts.
# Pinning `image` means it is built once and the two jobs reuse it rather than each building a copy.
x-app: &app
  image: ${PROJECT_SLUG}-app
  build:
    context: ..
    dockerfile: docker/Dockerfile
  logging: *logging

# What the container needs.
#
# There is one process now: each module creates its own database on its first request, migrates it and
# opens it, so there is no deployment step to declare variables to. `DATABASE_URL` is the account that
# owns the server, because creating a database needs one.
x-app-environment: &app-environment
  PROJECT_SLUG: ${PROJECT_SLUG}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
  # Set any of these to put one module's database on another server or under other credentials.
  DATABASE_URL_ADMIN: ${DATABASE_URL_ADMIN:-}
  DATABASE_URL_AUTH: ${DATABASE_URL_AUTH:-}
  DATABASE_URL_USERS: ${DATABASE_URL_USERS:-}
  DATABASE_URL_NOTIFICATIONS: ${DATABASE_URL_NOTIFICATIONS:-}
  DATABASE_URL_EMAIL: ${DATABASE_URL_EMAIL:-}

services:
  # The application: every module in one process. Gateway is the only one mounted on the port.
  server:
    <<: *app
    environment:
      <<: *app-environment
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:?PUBLIC_SITE_URL is required}
      AUTH_SESSION_TTL_SECONDS: ${AUTH_SESSION_TTL_SECONDS:-2592000}
      # A production deployment that leaves this on `log` sends nothing: messages are recorded and
      # stay put. That is a deliberate default — a misconfigured transport should not mail people.
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-log}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:?EMAIL_FROM_ADDRESS is required}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-}
      UNISENDER_GO_API_KEY: ${UNISENDER_GO_API_KEY:-}
      UNISENDER_GO_API_URL: ${UNISENDER_GO_API_URL:-}
    # The only container the platform routes traffic to. No `ports`: publishing one would put the
    # application on the host's network instead of behind whatever terminates TLS.
    expose: ['8080']
    depends_on:
      adminer:
        condition: service_started
    restart: unless-stopped
    networks: [internal]

  adminer:
    build:
      context: adminer
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      # The wrapper prefers these over the credentials in DATABASE_URL, which is how a deployment
      # gives the database console an account with fewer rights than the services have.
      ADMINER_SERVER: ${ADMINER_SERVER:-}
      ADMINER_USERNAME: ${ADMINER_USERNAME:-}
      ADMINER_PASSWORD: ${ADMINER_PASSWORD:-}
    # Internal only, exactly as locally: reachable through Gateway's owner-only route and nowhere
    # else. It never gets a host port, in any environment.
    expose: ['8080']
    networks: [internal]
    logging: *logging

networks:
  internal:
    driver: bridge
